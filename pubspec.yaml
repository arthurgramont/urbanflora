name: urban_flora
description: "Urban field guide powered by Gemini. Isar & Firebase"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  # UI, Fonts & Assets
  google_fonts: ^6.2.1
  flutter_dotenv: ^5.2.1

  # State Management
  flutter_riverpod: ^2.6.1

  # Hardware & Services
  camera: ^0.11.0+2
  geolocator: ^13.0.1
  http: ^1.2.2
  google_generative_ai: ^0.4.6

  # Persistance locale (Isar 3.x stable)
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.4

  # Firebase Cloud & Auth
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  go_router: ^18.0.1
  dio: ^5.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  isar_generator: ^3.1.0+1


flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/icons/